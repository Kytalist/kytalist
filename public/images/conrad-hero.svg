<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="NASA Conrad Challenge preparation course">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062E35"/>
      <stop offset="50%" stop-color="#0B4650"/>
      <stop offset="100%" stop-color="#1B3A6B"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.15" r="0.5">
      <stop offset="0%" stop-color="#F28F6B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F28F6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#A3E4D7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A3E4D7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.9" r="0.45">
      <stop offset="0%" stop-color="#6FD3BE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6FD3BE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6ECFB"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD3B6"/>
      <stop offset="50%" stop-color="#F28F6B"/>
      <stop offset="100%" stop-color="#B4532A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- transparent background so the hero gradient shows through -->

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="80" r="1.5" opacity="0.9"/>
    <circle cx="140" cy="160" r="1" opacity="0.7"/>
    <circle cx="220" cy="60" r="1.2" opacity="0.8"/>
    <circle cx="310" cy="130" r="0.9" opacity="0.6"/>
    <circle cx="400" cy="90" r="1.4" opacity="0.9"/>
    <circle cx="500" cy="170" r="1" opacity="0.7"/>
    <circle cx="600" cy="70" r="1.3" opacity="0.85"/>
    <circle cx="700" cy="150" r="1.1" opacity="0.75"/>
    <circle cx="760" cy="50" r="1.6" opacity="0.95"/>
    <circle cx="90" cy="260" r="1" opacity="0.6"/>
    <circle cx="720" cy="280" r="1.2" opacity="0.7"/>
    <circle cx="180" cy="340" r="0.8" opacity="0.5"/>
    <circle cx="650" cy="400" r="1" opacity="0.65"/>
    <circle cx="50" cy="470" r="1.1" opacity="0.7"/>
    <circle cx="770" cy="520" r="0.9" opacity="0.6"/>
    <circle cx="300" cy="470" r="0.7" opacity="0.5"/>
    <circle cx="520" cy="520" r="1" opacity="0.65"/>
  </g>

  <!-- distant planet -->
  <circle cx="680" cy="200" r="46" fill="#1F6FB2" opacity="0.35"/>
  <circle cx="680" cy="200" r="46" fill="none" stroke="#A3E4D7" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="680" cy="200" rx="70" ry="14" fill="none" stroke="#A3E4D7" stroke-width="1" opacity="0.35"/>

  <!-- moon surface -->
  <path d="M0 820 Q200 780 400 800 T800 790 L800 1000 L0 1000 Z" fill="#0A1F2A" opacity="0.7"/>
  <path d="M0 860 Q200 830 400 850 T800 840 L800 1000 L0 1000 Z" fill="#06141C" opacity="0.85"/>
  <g fill="#0B4650" opacity="0.4">
    <circle cx="120" cy="900" r="18"/>
    <circle cx="340" cy="880" r="12"/>
    <circle cx="560" cy="910" r="22"/>
    <circle cx="700" cy="890" r="14"/>
  </g>

  <!-- rocket -->
  <g transform="translate(400 470) rotate(-8)">
    <!-- flame -->
    <path d="M-18 95 Q0 170 18 95 Z" fill="url(#flame)"/>
    <path d="M-10 95 Q0 140 10 95 Z" fill="#FFD3B6" opacity="0.85"/>
    <!-- body -->
    <path d="M-26 90 L-26 -40 Q0 -95 26 -40 L26 90 Z" fill="url(#rocket)" stroke="#0B4650" stroke-width="2"/>
    <!-- nose cone -->
    <path d="M-26 -40 Q0 -100 26 -40 Z" fill="#F28F6B"/>
    <!-- window -->
    <circle cx="0" cy="-10" r="11" fill="#1B7A88" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="-3" cy="-13" r="3" fill="#FFFFFF" opacity="0.6"/>
    <!-- fins -->
    <path d="M-26 50 L-46 85 L-26 85 Z" fill="#F28F6B"/>
    <path d="M26 50 L46 85 L26 85 Z" fill="#F28F6B"/>
    <!-- stripe -->
    <rect x="-26" y="25" width="52" height="8" fill="#0B4650" opacity="0.15"/>
  </g>

  <!-- orbit ring -->
  <ellipse cx="400" cy="470" rx="150" ry="40" fill="none" stroke="#FFD3B6" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>

  <!-- floating badge -->
  <g transform="translate(120 300)">
    <rect x="0" y="0" width="170" height="46" rx="23" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="85" y="29" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">12 classes · 6 modules</text>
  </g>

  <g transform="translate(520 620)">
    <rect x="0" y="0" width="150" height="46" rx="23" fill="rgba(242,143,107,0.25)" stroke="#F28F6B" stroke-width="1"/>
    <text x="75" y="29" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFD3B6" text-anchor="middle">Early bird ৳2,499</text>
  </g>
</svg>
